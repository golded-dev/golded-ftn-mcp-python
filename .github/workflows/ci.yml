name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install with public dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --no-sources . pytest ruff mypy build twine
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check . && uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
      - run: uv build && uv run --no-sync twine check dist/*
