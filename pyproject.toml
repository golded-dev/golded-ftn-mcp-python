[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "golded-ftn-mcp"
version = "1.0.2"
description = "Local read-only MCP server for GoldED FTN message bases"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "golded-ftn-tools>=1.0.2,<2",
  "mcp>=1.9",
]

[project.scripts]
golded-ftn-mcp = "golded_ftn_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/golded_ftn_mcp"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
golded-ftn-tools = { path = "../golded-ftn-tools", editable = true }
